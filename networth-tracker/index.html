    // --- MAIN REACT APPLICATION ---
    function App() {
      // 1. Theme State (synchronized with finvest_theme)
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('finvest_theme');
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('finvest_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // 2. Data Persistence (finvest_networth_*)
      const [accounts, setAccounts] = useState(() => {
        try {
          const raw = localStorage.getItem('finvest_networth_accounts');
          return raw ? JSON.parse(raw) : SEED_ACCOUNTS;
        } catch (e) {
          return SEED_ACCOUNTS;
        }
      });

      const [snapshots, setSnapshots] = useState(() => {
        try {
          const raw = localStorage.getItem('finvest_networth_snapshots');
          return raw ? JSON.parse(raw) : SEED_SNAPSHOTS;
        } catch (e) {
          return SEED_SNAPSHOTS;
        }
      });

      useEffect(() => {
        localStorage.setItem('finvest_networth_accounts', JSON.stringify(accounts));
      }, [accounts]);

      useEffect(() => {
        localStorage.setItem('finvest_networth_snapshots', JSON.stringify(snapshots));
      }, [snapshots]);

      // Navigation Suite Links
      const suiteApps = [
        { name: 'Budget', url: 'https://budget.yourdomain.com', active: false, desc: 'Cashflow & Expenses' },
        { name: 'Retirement', url: 'https://retirement.yourdomain.com', active: false, desc: 'FIRE & Projections' },

      ];

      // UI States
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard' | 'record' | 'accounts' | 'history'
      const [isMobileNavOpen, setIsMobileNavOpen] = useState(false);
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
      const [isAddAccountModalOpen, setIsAddAccountModalOpen] = useState(false);
      const [editingAccount, setEditingAccount] = useState(null);
      const [editingSnapshot, setEditingSnapshot] = useState(null);
      const [toast, setToast] = useState(null);

      // Snapshot entry form state
      const [entryDate, setEntryDate] = useState('2026-10-09');
      const [entryNotes, setEntryNotes] = useState('');
      const [entryBalances, setEntryBalances] = useState({});

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3500);
      };

      // Account Map Lookup
      const accountMap = useMemo(() => {
        const map = {};
        accounts.forEach(a => { map[a.id] = a; });
        return map;
      }, [accounts]);

      // Sorted snapshots by date ascending
      const sortedSnapshots = useMemo(() => {
        return [...snapshots].sort((a, b) => new Date(a.date) - new Date(b.date));
      }, [snapshots]);

      // Calculate calculated totals for each snapshot
      const snapshotCalculations = useMemo(() => {
        return sortedSnapshots.map(snp => {
          let totalAssets = 0;
          let totalLiabilities = 0;
          let retirementAssets = 0;
          const categoryAssets = {};

          Object.keys(snp.balances || {}).forEach(accId => {
            const acc = accountMap[accId];
            const val = Number(snp.balances[accId]) || 0;
            if (!acc) return;

            if (acc.type === 'asset') {
              totalAssets += val;
              if (acc.isRetirement) {
                retirementAssets += val;
              }
              const cat = acc.category || 'other';
              categoryAssets[cat] = (categoryAssets[cat] || 0) + val;
            } else if (acc.type === 'liability') {
              totalLiabilities += val;
            }
          });

          const netWorth = totalAssets - totalLiabilities;
          const debtToAsset = totalAssets > 0 ? (totalLiabilities / totalAssets) * 100 : 0;
          const retirementRatio = totalAssets > 0 ? (retirementAssets / totalAssets) * 100 : 0;

          return {
            id: snp.id,
            date: snp.date,
            formattedDate: new Date(snp.date + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', year: 'numeric' }),
            notes: snp.notes,
            balances: snp.balances,
            totalAssets,
            totalLiabilities,
            retirementAssets,
            netWorth,
            debtToAsset,
            retirementRatio,
            categoryAssets
          };
        });
      }, [sortedSnapshots, accountMap]);

      // Latest Snapshot for current dashboard stats
      const latestSnapshot = useMemo(() => {
        if (snapshotCalculations.length === 0) return null;
        return snapshotCalculations[snapshotCalculations.length - 1];
      }, [snapshotCalculations]);

      // Previous snapshot for month-over-month delta
      const previousSnapshot = useMemo(() => {
        if (snapshotCalculations.length < 2) return null;
        return snapshotCalculations[snapshotCalculations.length - 2];
      }, [snapshotCalculations]);

      // Pre-fill balance entry when switching to 'record' tab
      useEffect(() => {
        if (latestSnapshot && Object.keys(entryBalances).length === 0) {
          setEntryBalances(latestSnapshot.balances || {});

      const handleSaveSnapshot = (e) => {

            date: entryDate,
            notes: entryNotes,
            balances: newBalances

            balances: newBalances

          setSnapshots(prev => [...prev, newSnp]);
          showToast(`New snapshot for ${entryDate} recorded`);
        }

        setActiveTab('dashboard');

                    <div key={acc.id} className="p-4 flex items-center justify-between gap-4 hover:bg-slate-50/60 dark:hover:bg-slate-800/40 transition">
                      <div className="flex items-center gap-3">
                        <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${
                          acc.type === 'asset'
                            ? 'bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400'
                            : 'bg-rose-50 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400'
                        }`}>
                          <Icon name={acc.type === 'asset' ? 'trendingUp' : 'trendingDown'} size={15} />
                        </div>
                        <div>
                          <div className="text-xs font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <span>{acc.name}</span>
                            {acc.isRetirement && (
                              <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-400 font-semibold border border-amber-200/50">
                                🏖️ Retirement Account
                              </span>
                            )}
                          </div>
                          <div className="text-[11px] text-slate-400">
                            {acc.institution} • Type: <span className="capitalize">{acc.type}</span> ({acc.category})
                          </div>
                        </div>
                      </div>

                      <div className="flex items-center gap-1">
                        <button
                          onClick={() => { setEditingAccount(acc); setIsAddAccountModalOpen(true); }}
                          className="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-950/50 transition"
                          title="Edit Account"
                        >
                          <Icon name="edit" size={14} />
                        </button>
                        <button
                          onClick={() => handleDeleteAccount(acc.id)}
                          className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/50 transition"
                          title="Delete Account"
                        >
                          <Icon name="trash" size={14} />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* ========================================================
                TAB 4: SNAPSHOT HISTORY LEDGER TABLE
               ======================================================== */}
            {activeTab === 'history' && (
              <div className="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 shadow-sm overflow-hidden">
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <div>
                    <h2 className="text-base font-bold text-slate-900 dark:text-white">Historical Snapshot Records</h2>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Review, inspect, or modify prior net worth records.
                    </p>
                  </div>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead>
                      <tr className="bg-slate-50/80 dark:bg-slate-800/40 border-b border-slate-200 dark:border-slate-800 text-[11px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">
                        <th className="py-3 px-4 sm:px-6">Date</th>
                        <th className="py-3 px-4 sm:px-6">Memo</th>
                        <th className="py-3 px-4 sm:px-6 text-right">Total Assets</th>
                        <th className="py-3 px-4 sm:px-6 text-right">Total Liabilities</th>
                        <th className="py-3 px-4 sm:px-6 text-right">Net Worth</th>
                        <th className="py-3 px-4 sm:px-6 text-right">Retirement</th>
                        <th className="py-3 px-4 sm:px-6 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800 text-xs">
                      {snapshotCalculations.map(snp => (
                        <tr key={snp.id} className="hover:bg-slate-50/70 dark:hover:bg-slate-800/40 transition">
                          <td className="py-3.5 px-4 sm:px-6 whitespace-nowrap font-bold text-slate-900 dark:text-white">
                            {snp.date}
                          </td>
                          <td className="py-3.5 px-4 sm:px-6 text-slate-500 dark:text-slate-400">
                            {snp.notes || '—'}
                          </td>
                          <td className="py-3.5 px-4 sm:px-6 text-right font-semibold text-emerald-600 dark:text-emerald-400 num-tabular">
                            {formatCurrency(snp.totalAssets)}
                          </td>
                          <td className="py-3.5 px-4 sm:px-6 text-right font-semibold text-rose-600 dark:text-rose-400 num-tabular">
                            {formatCurrency(snp.totalLiabilities)}
                          </td>
                          <td className="py-3.5 px-4 sm:px-6 text-right font-extrabold text-slate-900 dark:text-white num-tabular text-sm">
                            {formatCurrency(snp.netWorth)}
                          </td>
                          <td className="py-3.5 px-4 sm:px-6 text-right font-semibold text-amber-600 dark:text-amber-400 num-tabular">
                            {formatCurrency(snp.retirementAssets)}
                          </td>
                          <td className="py-3.5 px-4 sm:px-6 text-right whitespace-nowrap">
                            <div className="flex items-center justify-end gap-1">
                              <button
                                onClick={() => handleEditSnapshotInit(snp)}
                                className="p-1.5 rounded-lg text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400"
                                title="Edit Snapshot"
                              >
                                <Icon name="edit" size={14} />
                              </button>
                              <button
                                onClick={() => handleDeleteSnapshot(snp.id)}
                                className="p-1.5 rounded-lg text-slate-400 hover:text-rose-600 dark:hover:text-rose-400"
                                title="Delete Snapshot"
                              >
                                <Icon name="trash" size={14} />
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-800 mt-16 py-8 bg-white/50 dark:bg-slate-900/50 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-slate-700 dark:text-slate-300">FinVest Suite</span>
                <span>•</span>
                <span>App 4 of 4: Net Worth Tracker</span>
              </div>
              <div className="flex items-center gap-4">
                <span>Complete Personal Finance Suite</span>
                <span>•</span>
                <span>100% Client-Side Local Storage</span>
              </div>
            </div>
          </footer>

          {/* ========================================================
              MODAL 1: CREATE / EDIT CUSTOM ACCOUNT
             ======================================================== */}
          {isAddAccountModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-md w-full overflow-hidden modal-animate">
                
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">
                    {editingAccount ? 'Edit Account' : 'Create Custom Account'}
                  </h3>
                  <button
                    onClick={() => { setIsAddAccountModalOpen(false); setEditingAccount(null); }}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleSaveAccount({
                      name: formData.get('name').trim(),
                      type: formData.get('type'),
                      category: formData.get('category'),
                      institution: formData.get('institution').trim(),
                      isRetirement: formData.get('isRetirement') === 'on'
                    });
                  }}
                  className="p-5 space-y-4"
                >
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5">
                      Account Type *
                    </label>
                    <div className="grid grid-cols-2 gap-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-xl text-xs font-bold text-center">
                      <label className="cursor-pointer">
                        <input
                          type="radio"
                          name="type"
                          value="asset"
                          defaultChecked={editingAccount ? editingAccount.type === 'asset' : true}
                          className="sr-only peer"
                        />
                        <div className="py-2 rounded-lg peer-checked:bg-emerald-600 peer-checked:text-white text-slate-600 dark:text-slate-300 transition">
                          Asset (+)
                        </div>
                      </label>
                      <label className="cursor-pointer">
                        <input
                          type="radio"
                          name="type"
                          value="liability"
                          defaultChecked={editingAccount ? editingAccount.type === 'liability' : false}
                          className="sr-only peer"
                        />
                        <div className="py-2 rounded-lg peer-checked:bg-rose-600 peer-checked:text-white text-slate-600 dark:text-slate-300 transition">
                          Liability (-)
                        </div>
                      </label>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">
                      Account Name *
                    </label>
                    <input
                      type="text"
                      name="name"
                      required
                      placeholder="e.g. Fidelity 401(k), Primary Mortgage"
                      defaultValue={editingAccount ? editingAccount.name : ''}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">
                        Category
                      </label>
                      <select
                        name="category"
                        defaultValue={editingAccount ? editingAccount.category : 'cash'}
                        className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      >
                        <option value="cash">Cash & Savings</option>
                        <option value="retirement">Retirement Account</option>
                        <option value="investment">Taxable Brokerage</option>
                        <option value="real_estate">Real Estate</option>
                        <option value="crypto">Crypto & Alts</option>
                        <option value="mortgage">Mortgage</option>
                        <option value="auto_loan">Auto Loan</option>
                        <option value="credit_card">Credit Card</option>
                        <option value="other">Other</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">
                        Institution
                      </label>
                      <input
                        type="text"
                        name="institution"
                        placeholder="e.g. Vanguard, Chase"
                        defaultValue={editingAccount ? editingAccount.institution : ''}
                        className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Retirement Account Checkbox */}
                  <div className="p-3 bg-slate-50 dark:bg-slate-800/60 rounded-xl border border-slate-200 dark:border-slate-700">
                    <label className="flex items-center gap-2.5 cursor-pointer">
                      <input
                        type="checkbox"
                        name="isRetirement"
                        defaultChecked={editingAccount ? editingAccount.isRetirement : false}
                        className="w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-300"
                      />
                      <div>
                        <div className="text-xs font-bold text-slate-900 dark:text-white">Mark as Retirement Account</div>
                        <div className="text-[10px] text-slate-500 dark:text-slate-400">
                          Included in the Retirement Tracker trendline (e.g. 401k, Traditional/Roth IRA, HSA).
                        </div>
                      </div>
                    </label>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2.5">
                    <button
                      type="button"
                      onClick={() => { setIsAddAccountModalOpen(false); setEditingAccount(null); }}
                      className="px-4 py-2 text-xs font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition"
                    >
                      Save Account
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ========================================================
              MODAL 2: DATA BACKUP (EXPORT / IMPORT JSON)
             ======================================================== */}
          {isBackupModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden modal-animate">
                
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                      <Icon name="database" size={18} className="text-indigo-500" />
                      Net Worth Backup & Portability
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Your balance sheet lives exclusively in browser <code className="text-indigo-500">localStorage</code>.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsBackupModalOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-6 space-y-6">
                  
                  <div className="p-3.5 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/60 text-xs text-indigo-950 dark:text-indigo-200 flex items-start gap-2.5">
                    <Icon name="shieldCheck" size={16} className="text-indigo-600 dark:text-indigo-400 shrink-0 mt-0.5" />
                    <div>
                      <span className="font-semibold">Local-First Storage:</span> Saved under key prefix <code className="font-mono text-indigo-600 dark:text-indigo-300">finvest_networth_*</code>.
                    </div>
                  </div>

                  {/* Export Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Export Net Worth to JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Download all {snapshots.length} historical snapshots & {accounts.length} accounts.
                      </div>
                    </div>
                    <button
                      onClick={handleExportBackup}
                      className="px-3.5 py-2 text-xs font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-1.5 transition"
                    >
                      <Icon name="download" size={14} />
                      <span>Export JSON</span>
                    </button>
                  </div>

                  {/* Import Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Import from JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Restore balance sheet records from a previous backup file.
                      </div>
                    </div>
                    <label className="cursor-pointer px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 shadow-sm flex items-center gap-1.5 transition">
                      <Icon name="upload" size={14} />
                      <span>Import File</span>
                      <input
                        type="file"
                        accept=".json,application/json"
                        onChange={handleImportBackup}
                        className="sr-only"
                      />
                    </label>
                  </div>

                  {/* Reset Demo Data */}
                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <span className="text-xs text-slate-500">Need to reload sample demo balance sheet?</span>
                    <button
                      onClick={handleResetDemoData}
                      className="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline flex items-center gap-1"
                    >
                      <Icon name="refresh" size={13} />
                      <span>Load Sample Data</span>
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount with React 18 createRoot
    const rootEl = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      ReactDOM.render(<App />, rootEl);
    }
  </script>
</body>
</html>
