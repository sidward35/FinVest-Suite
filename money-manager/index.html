        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('finvest_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

        try {
          const raw = localStorage.getItem('finvest_budget_categories');
          return raw ? JSON.parse(raw) : DEFAULT_CATEGORIES;
        } catch (e) {
          return DEFAULT_CATEGORIES;
        }

          return raw ? JSON.parse(raw) : SEED_TRANSACTIONS;

          return SEED_TRANSACTIONS;
        }
      });

        const map = {};

      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Filtered transactions for calculation
      const periodTransactions = useMemo(() => {
        return transactions.filter(t => {
          if (timePeriod === 'all-2026') {
            return t.date.startsWith('2026');
          }
          return t.date.startsWith(timePeriod);
        });
      }, [transactions, timePeriod]);

      // Financial Metrics for current period
      const metrics = useMemo(() => {
        let income = 0;
        let expense = 0;
        periodTransactions.forEach(t => {
          if (t.type === 'income') income += Number(t.amount);
          if (t.type === 'expense') expense += Number(t.amount);
        });
        const net = income - expense;
        const savingsRate = income > 0 ? ((net / income) * 100) : 0;
        return {
          income,
          expense,
          net,
          savingsRate: Math.max(0, savingsRate)
        };
      }, [periodTransactions]);

      // Spending by Category (for Donut Chart & Category breakdown)
      const spendingByCategory = useMemo(() => {
        const catTotals = {};
        periodTransactions.forEach(t => {
          if (t.type === 'expense') {
            catTotals[t.categoryId] = (catTotals[t.categoryId] || 0) + Number(t.amount);

          // Category filter
          if (filterCategory !== 'all' && t.categoryId !== filterCategory) return false;

          // Search query
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const catName = (categoryMap[t.categoryId]?.name || '').toLowerCase();
            const desc = (t.description || '').toLowerCase();
            const notes = (t.notes || '').toLowerCase();
            const amountStr = String(t.amount);
            return desc.includes(q) || notes.includes(q) || catName.includes(q) || amountStr.includes(q);
          }

          return true;

          if (sortField === 'date') {
            const diff = new Date(b.date) - new Date(a.date);
            return sortAsc ? -diff : diff;
          }
          if (sortField === 'amount') {
            return sortAsc ? (a.amount - b.amount) : (b.amount - a.amount);

          data: {

        const fileName = `finvest-budget-backup-${new Date().toISOString().slice(0, 10)}.json`;

                    <button
                      type="button"
                      onClick={() => { setIsAddTxModalOpen(false); setEditingTx(null); }}
                      className="px-4 py-2 text-xs font-medium rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md shadow-indigo-600/20 transition"
                    >
                      {editingTx ? 'Update Entry' : 'Save Transaction'}
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ========================================================
              MODAL 2: ADD CUSTOM CATEGORY
             ======================================================== */}
          {isAddCatModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden modal-animate">
                
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <h3 className="font-bold text-base text-slate-900 dark:text-white">
                    Create Custom Category
                  </h3>
                  <button
                    onClick={() => setIsAddCatModalOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    handleSaveCategory({
                      name: formData.get('name'),
                      type: formData.get('type'),
                      emoji: formData.get('emoji'),
                      color: formData.get('color'),
                    });
                  }}
                  className="p-5 space-y-4"
                >
                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">
                      Category Name *
                    </label>
                    <input
                      type="text"
                      name="name"
                      required
                      placeholder="e.g. Pet Care, SaaS Subscriptions"
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">
                      Category Type
                    </label>
                    <select
                      name="type"
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white text-xs font-medium"
                    >
                      <option value="expense">Expense</option>
                      <option value="income">Income</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">
                      Choose Emoji
                    </label>
                    <div className="grid grid-cols-6 gap-2 max-h-36 overflow-y-auto p-1 bg-slate-50 dark:bg-slate-800/50 rounded-xl border border-slate-200 dark:border-slate-700">
                      {EMOJI_PALETTE.map((emoji, idx) => (
                        <label key={idx} className="cursor-pointer text-center">
                          <input
                            type="radio"
                            name="emoji"
                            value={emoji}
                            defaultChecked={idx === 0}
                            className="sr-only peer"
                          />
                          <div className="p-1.5 text-lg rounded-lg peer-checked:bg-indigo-600 peer-checked:scale-110 hover:bg-slate-200 dark:hover:bg-slate-700 transition">
                            {emoji}
                          </div>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-2">
                      Color Swatch
                    </label>
                    <div className="flex items-center gap-2">
                      {COLOR_PALETTE.map((color, idx) => (
                        <label key={idx} className="cursor-pointer">
                          <input
                            type="radio"
                            name="color"
                            value={color.hex}
                            defaultChecked={idx === 0}
                            className="sr-only peer"
                          />
                          <div
                            className="w-6 h-6 rounded-full peer-checked:ring-2 peer-checked:ring-offset-2 peer-checked:ring-indigo-500 transition"
                            style={{ backgroundColor: color.hex }}
                          ></div>
                        </label>
                      ))}
                    </div>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setIsAddCatModalOpen(false)}
                      className="px-4 py-2 text-xs font-medium rounded-xl text-slate-600 dark:text-slate-300"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition"
                    >
                      Add Category
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* ========================================================
              MODAL 3: DATA BACKUP (EXPORT / IMPORT JSON)
             ======================================================== */}
          {isBackupModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden modal-animate">
                
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                      <Icon name="database" size={18} className="text-indigo-500" />
                      Data Backup & Portability
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Your records live exclusively in browser <code className="text-indigo-500">localStorage</code>.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsBackupModalOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-6 space-y-6">
                  
                  {/* Storage Specs Note */}
                  <div className="p-3.5 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/60 text-xs text-indigo-950 dark:text-indigo-200 flex items-start gap-2.5">
                    <Icon name="shieldCheck" size={16} className="text-indigo-600 dark:text-indigo-400 shrink-0 mt-0.5" />
                    <div>
                      <span className="font-semibold">Local-First Guarantee:</span> No tracking, no backend database, and no telemetry. Prefix: <code className="font-mono text-indigo-600 dark:text-indigo-300">finvest_budget_*</code>.
                    </div>
                  </div>

                  {/* Export Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Export to JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Download all {transactions.length} transactions & {categories.length} categories.
                      </div>
                    </div>
                    <button
                      onClick={handleExportBackup}
                      className="px-3.5 py-2 text-xs font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-1.5 transition"
                    >
                      <Icon name="download" size={14} />
                      <span>Export JSON</span>
                    </button>
                  </div>

                  {/* Import Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Import from JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Restore data from a previously exported backup file.
                      </div>
                    </div>
                    <label className="cursor-pointer px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 shadow-sm flex items-center gap-1.5 transition">
                      <Icon name="upload" size={14} />
                      <span>Import File</span>
                      <input
                        type="file"
                        accept=".json,application/json"
                        onChange={handleImportBackup}
                        className="sr-only"
                      />
                    </label>
                  </div>

                  {/* Danger Zone */}
                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800">
                    <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
                      Data Reset & Demo Tools
                    </div>
                    <div className="flex items-center gap-3">
                      <button
                        onClick={handleResetDemoData}
                        className="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline flex items-center gap-1"
                      >
                        <Icon name="refresh" size={13} />
                        <span>Load Sample Demo Data</span>
                      </button>
                      <span className="text-slate-300 dark:text-slate-700">|</span>
                      <button
                        onClick={handleClearAll}
                        className="text-xs text-rose-600 dark:text-rose-400 font-medium hover:underline flex items-center gap-1"
                      >
                        <Icon name="trash" size={13} />
                        <span>Wipe All Data</span>
                      </button>
                    </div>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount with React 18 createRoot
    const rootEl = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      ReactDOM.render(<App />, rootEl);
    }
  </script>
</body>
</html>
