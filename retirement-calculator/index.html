  <!-- React Application Script -->
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- ICON SYSTEM (Lucide-style Clean SVGs - All multi-elements wrapped in React Fragments) ---
    const Icon = ({ name, size = 18, className = "" }) => {

        refresh: <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16M16 16h5v5" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        x: <path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        menu: <path d="M4 12h16M4 6h16M4 18h16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,

        clock: <><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="2" /><polyline points="12 6 12 12 16 14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></>,
        sliders: <path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        checkCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /><polyline points="22 4 12 14.01 9 11.01" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></>,
        zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      };

      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          className={`inline-block shrink-0 ${className}`}
        >
          {icons[name] || icons.sunUmbrella}
        </svg>
      );
    };

    // --- CURRENCY & NUMBER FORMATTERS ---
    const formatCurrency = (num) => {
      if (num >= 1000000) {
        return `$${(num / 1000000).toFixed(2)}M`;
      }
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        maximumFractionDigits: 0
      }).format(num || 0);
    };

    const formatFullCurrency = (num) => {
      return new Intl.NumberFormat('en-US', {
        style: 'currency',
        currency: 'USD',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(num || 0);
    };

    // --- MONTE CARLO RANDOM NORMAL GENERATOR (Box-Muller) ---
    const randomNormal = (mean, stdDev) => {
      let u1 = 0, u2 = 0;
      while (u1 === 0) u1 = Math.random();
      while (u2 === 0) u2 = Math.random();
      const z0 = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      return mean + z0 * stdDev;
    };

    // --- DEFAULT RETIREMENT PROFILES & PRESETS ---
    const DEFAULT_PROFILE = {
      currentAge: 32,
      retirementAge: 62,
      lifeExpectancy: 92,
      currentBalance: 285000,
      annualSavings: 24000,
      savingsGrowthRate: 3.0,     // % wage/savings growth
      retirementAnnualExpenses: 72000,
      inflationRate: 2.5,         // % expected inflation
      stocksPct: 75,
      bondsPct: 20,
      cashPct: 5,
      // Market parameters
      stocksMean: 9.8,
      stocksStd: 16.5,
      bondsMean: 4.8,
      bondsStd: 6.5,
      cashMean: 2.8,
      cashStd: 1.2
    };

    const PRESETS = [
      {
        name: 'FIRE (Aggressive Early)',
        badge: '🚀 FIRE',
        desc: 'Retire at 45 with aggressive 85% equities',
        data: {
          currentAge: 28,
          retirementAge: 45,
          lifeExpectancy: 92,
          currentBalance: 190000,
          annualSavings: 42000,
          savingsGrowthRate: 3.5,
          retirementAnnualExpenses: 65000,
          inflationRate: 2.5,
          stocksPct: 85,
          bondsPct: 10,
          cashPct: 5
        }
      },
      {
        name: 'Standard Balanced (Age 62)',
        badge: '⚖️ Classic',
        desc: 'Traditional 75/20/5 wealth accumulation',
        data: { ...DEFAULT_PROFILE }
      },
      {
        name: 'Conservative Wealth Preservation',
        badge: '🛡️ Low Risk',
        desc: 'Higher bond allocation for peace of mind',
        data: {
          currentAge: 45,
          retirementAge: 65,
          lifeExpectancy: 95,
          currentBalance: 520000,
          annualSavings: 28000,
          savingsGrowthRate: 2.0,
          retirementAnnualExpenses: 80000,
          inflationRate: 2.8,
          stocksPct: 50,
          bondsPct: 40,
          cashPct: 10
        }
      }
    ];

    // --- MAIN REACT APPLICATION ---
    function App() {
      // 1. Theme State (synchronized with finvest_theme)
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('finvest_theme');
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('finvest_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      // 2. State & Storage (finvest_retirement_*)
      const [profile, setProfile] = useState(() => {
        try {
          const raw = localStorage.getItem('finvest_retirement_profile');
          return raw ? { ...DEFAULT_PROFILE, ...JSON.parse(raw) } : DEFAULT_PROFILE;
        } catch (e) {
          return DEFAULT_PROFILE;
        }
      });

      useEffect(() => {
        localStorage.setItem('finvest_retirement_profile', JSON.stringify(profile));
      }, [profile]);

      // Navigation Suite Links
      const suiteApps = [
        { name: 'Budget', url: 'https://finvest.smathur.xyz/money-manager', active: false, desc: 'Cashflow & Expenses' },
        { name: 'Retirement', url: 'https://finvest.smathur.xyz/retirement-calculator', active: true, desc: 'FIRE & Projections' },
        { name: 'Investments', url: 'https://finvest.smathur.xyz/investments-tracker', active: false, desc: 'Holdings & Dividends' },
        { name: 'Net Worth', url: 'https://finvest.smathur.xyz/networth-tracker', active: false, desc: 'Assets & Liabilities' },
      ];

      // UI States
      const [activeTab, setActiveTab] = useState('montecarlo'); // 'montecarlo' | 'longevity' | 'assumptions'
      const [isMobileNavOpen, setIsMobileNavOpen] = useState(false);
      const [isBackupModalOpen, setIsBackupModalOpen] = useState(false);
      const [toast, setToast] = useState(null);
      const [activeHoverPoint, setActiveHoverPoint] = useState(null);

      // Custom Longevity test slider state
      const [customWithdrawalRate, setCustomWithdrawalRate] = useState(4.0);

      const showToast = (message) => {
        setToast(message);
        setTimeout(() => setToast(null), 3500);
      };

      // Update Profile Fields
      const updateField = (field, value) => {
        setProfile(prev => ({
          ...prev,
          [field]: typeof value === 'number' ? value : parseFloat(value) || 0
        }));
      };

      // Asset Allocation Sync (Ensures 100% total)
      const handleAllocationChange = (type, val) => {
        const numVal = Math.min(100, Math.max(0, parseInt(val) || 0));
        setProfile(prev => {
          if (type === 'stocks') {
            const remainder = 100 - numVal;
            const bondRatio = prev.bondsPct + prev.cashPct > 0 ? prev.bondsPct / (prev.bondsPct + prev.cashPct) : 0.8;
            const newBonds = Math.round(remainder * bondRatio);
            const newCash = remainder - newBonds;
            return { ...prev, stocksPct: numVal, bondsPct: newBonds, cashPct: newCash };
          } else if (type === 'bonds') {
            const remainder = 100 - numVal;
            const stockRatio = prev.stocksPct + prev.cashPct > 0 ? prev.stocksPct / (prev.stocksPct + prev.cashPct) : 0.9;
            const newStocks = Math.round(remainder * stockRatio);
            const newCash = remainder - newStocks;
            return { ...prev, stocksPct: newStocks, bondsPct: numVal, cashPct: newCash };
          } else {
            const remainder = 100 - numVal;
            const stockRatio = prev.stocksPct + prev.bondsPct > 0 ? prev.stocksPct / (prev.stocksPct + prev.bondsPct) : 0.8;
            const newStocks = Math.round(remainder * stockRatio);
            const newBonds = remainder - newStocks;
            return { ...prev, stocksPct: newStocks, bondsPct: newBonds, cashPct: numVal };
          }
        });
      };

      // --- BLENDED PORTFOLIO STATS ---
      const portfolioStats = useMemo(() => {
        const ws = profile.stocksPct / 100;
        const wb = profile.bondsPct / 100;
        const wc = profile.cashPct / 100;

        const meanNominal = (ws * profile.stocksMean) + (wb * profile.bondsMean) + (wc * profile.cashMean);
        // Portfolio StDev with stock-bond correlation ~ 0.15
        const varStocks = Math.pow(ws * profile.stocksStd, 2);
        const varBonds = Math.pow(wb * profile.bondsStd, 2);
        const varCash = Math.pow(wc * profile.cashStd, 2);
        const covSB = 2 * ws * wb * profile.stocksStd * profile.bondsStd * 0.15;
        const stdDev = Math.sqrt(varStocks + varBonds + varCash + covSB);

        const realMean = meanNominal - profile.inflationRate;

        return {
          meanNominal,
          stdDev,
          realMean
        };
      }, [profile]);

      // --- MONTE CARLO SIMULATION ENGINE (500 Paths) ---
      const simulationResults = useMemo(() => {
        const NUM_SIMULATIONS = 500;
        const totalYears = profile.lifeExpectancy - profile.currentAge;
        if (totalYears <= 0) return { trajectory: [], successRate: 0, medianRetirementBalance: 0 };

        const allPaths = []; // [simIndex][yearIndex]
        let successfulRuns = 0;

        // Portfolio expected nominal & std dev
        const meanReturn = portfolioStats.meanNominal / 100;
        const stdReturn = portfolioStats.stdDev / 100;
        const inflation = profile.inflationRate / 100;
        const wageGrowth = profile.savingsGrowthRate / 100;

        for (let sim = 0; sim < NUM_SIMULATIONS; sim++) {
          const path = [];
          let currentBalance = profile.currentBalance;
          let ranOutOfMoney = false;

          for (let yr = 0; yr <= totalYears; yr++) {
            const age = profile.currentAge + yr;

            if (yr === 0) {
              path.push({ age, balance: currentBalance });
              continue;
            }

            // Market return for this specific year in this path
            const annualReturn = randomNormal(meanReturn, stdReturn);

            if (age <= profile.retirementAge) {
              // Accumulation Phase: Add growing savings contributions
              const savingsThisYear = profile.annualSavings * Math.pow(1 + wageGrowth, yr - 1);
              currentBalance = (currentBalance + savingsThisYear) * (1 + annualReturn);
            } else {
              // Decumulation Phase: Withdraw inflation-adjusted retirement expenses
              const yearsIntoRetirement = age - profile.retirementAge;
              const expensesThisYear = profile.retirementAnnualExpenses * Math.pow(1 + inflation, yr);
              currentBalance = (currentBalance - expensesThisYear) * (1 + annualReturn);

              if (currentBalance <= 0) {
                currentBalance = 0;
                ranOutOfMoney = true;
              }
            }

            path.push({ age, balance: currentBalance });
          }

          if (!ranOutOfMoney) successfulRuns++;
          allPaths.push(path);
        }

        // Aggregate percentiles at each age step
        const trajectory = [];
        let medianRetirementBalance = 0;

        for (let yr = 0; yr <= totalYears; yr++) {
          const age = profile.currentAge + yr;
          const balancesAtYr = allPaths.map(p => p[yr].balance).sort((a, b) => a - b);

          const p10 = balancesAtYr[Math.floor(NUM_SIMULATIONS * 0.10)];
          const p50 = balancesAtYr[Math.floor(NUM_SIMULATIONS * 0.50)];
          const p90 = balancesAtYr[Math.floor(NUM_SIMULATIONS * 0.90)];

          if (age === profile.retirementAge) {
            medianRetirementBalance = p50;
          }

          trajectory.push({
            age,
            isRetirementYear: age === profile.retirementAge,
            pessimistic: Math.round(p10),
            median: Math.round(p50),
            optimistic: Math.round(p90)
          });
        }

        const successRate = Math.round((successfulRuns / NUM_SIMULATIONS) * 100);

        return {
          trajectory,
          successRate,
          medianRetirementBalance
        };
      }, [profile, portfolioStats]);

      // --- WITHDRAWAL RATE & LONGEVITY CALCULATOR MATRIX ---
      const longevityMatrix = useMemo(() => {
        const rates = [3.0, 3.5, 4.0, 4.5, 5.0, 6.0];
        const retBalance = simulationResults.medianRetirementBalance > 0
          ? simulationResults.medianRetirementBalance
          : profile.currentBalance * 2.5;

        const realReturn = portfolioStats.realMean / 100;

        return rates.map(rate => {
          const annualWithdrawal = retBalance * (rate / 100);
          let balance = retBalance;
          let yearsLasted = 0;
          const maxYears = 50;

          while (balance > 0 && yearsLasted < maxYears) {
            balance = (balance - annualWithdrawal) * (1 + realReturn);
            if (balance > 0) {
              yearsLasted++;
            }
          }

          const isPerpetual = yearsLasted >= maxYears && balance > (retBalance * 0.5);
          const depletionAge = profile.retirementAge + yearsLasted;

          // Trinity benchmark success probability
          let benchmarkSuccess = 98;
          if (rate === 3.0) benchmarkSuccess = 100;
          else if (rate === 3.5) benchmarkSuccess = 99;
          else if (rate === 4.0) benchmarkSuccess = 94;
          else if (rate === 4.5) benchmarkSuccess = 81;
          else if (rate === 5.0) benchmarkSuccess = 65;
          else if (rate === 6.0) benchmarkSuccess = 42;

          return {
            rate,
            annualWithdrawal,
            yearsLasted,
            isPerpetual,
            depletionAge,
            benchmarkSuccess
          };
        });
      }, [simulationResults.medianRetirementBalance, profile, portfolioStats]);

      // Custom Single Withdrawal Calculation
      const customLongevity = useMemo(() => {
        const retBalance = simulationResults.medianRetirementBalance > 0
          ? simulationResults.medianRetirementBalance
          : profile.currentBalance * 2.5;
        const rate = customWithdrawalRate;
        const annualWithdrawal = retBalance * (rate / 100);
        const realReturn = portfolioStats.realMean / 100;

        let balance = retBalance;
        let yearsLasted = 0;
        while (balance > 0 && yearsLasted < 60) {
          balance = (balance - annualWithdrawal) * (1 + realReturn);
          if (balance > 0) yearsLasted++;
        }

        const isPerpetual = yearsLasted >= 60;
        return {
          annualWithdrawal,
          yearsLasted,
          isPerpetual,
          depletionAge: profile.retirementAge + yearsLasted
        };
      }, [customWithdrawalRate, simulationResults.medianRetirementBalance, profile, portfolioStats]);

      // Backup: Export JSON
      const handleExportBackup = () => {
        const backupPayload = {
          app: 'finvest_retirement',
          version: '1.0.0',
          exportedAt: new Date().toISOString(),
          data: {
            profile,
            customWithdrawalRate
          }
        };

        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupPayload, null, 2));
        const downloadAnchor = document.createElement('a');
        const fileName = `finvest-retirement-backup-${new Date().toISOString().slice(0, 10)}.json`;
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast('Retirement settings exported to JSON');
      };

      // Backup: Import JSON
      const handleImportBackup = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            if (!parsed || parsed.app !== 'finvest_retirement' || !parsed.data) {
              alert('Invalid backup file. The uploaded file does not match the FinVest Retirement schema.');
              return;
            }

            if (parsed.data.profile) {
              setProfile(parsed.data.profile);
            }
            if (parsed.data.customWithdrawalRate) {
              setCustomWithdrawalRate(parsed.data.customWithdrawalRate);
            }
            showToast('Retirement profile successfully restored!');
            setIsBackupModalOpen(false);
          } catch (err) {
            alert('Failed to parse JSON file: ' + err.message);
          }
        };
        reader.readAsText(file);
      };

      const handleResetDefaults = () => {
        if (window.confirm('Reset all retirement simulation parameters to defaults?')) {
          setProfile(DEFAULT_PROFILE);
          showToast('Reset to default profile');

      // Chart Calculations for SVG Rendering
      const chartPoints = useMemo(() => {
        const traj = simulationResults.trajectory;
        if (!traj || traj.length === 0) return null;

        const maxBalance = Math.max(...traj.map(t => t.optimistic), 100000);
        const width = 800;
        const height = 300;
        const padding = { top: 20, right: 30, bottom: 40, left: 70 };

        const innerWidth = width - padding.left - padding.right;
        const innerHeight = height - padding.top - padding.bottom;

        const getX = (idx) => padding.left + (idx / (traj.length - 1)) * innerWidth;
        const getY = (val) => padding.top + innerHeight - (Math.max(0, val) / maxBalance) * innerHeight;

        // Path generator for optimistic, median, pessimistic
        let optPath = '';
        let medPath = '';
        let pessPath = '';
        let areaPath = '';

        traj.forEach((t, i) => {
          const x = getX(i);
          const yOpt = getY(t.optimistic);
          const yMed = getY(t.median);
          const yPess = getY(t.pessimistic);

          if (i === 0) {
            optPath += `M ${x} ${yOpt}`;
            medPath += `M ${x} ${yMed}`;
            pessPath += `M ${x} ${yPess}`;
          } else {
            optPath += ` L ${x} ${yOpt}`;
            medPath += ` L ${x} ${yMed}`;
            pessPath += ` L ${x} ${yPess}`;
          }
        });

        // Confidence Cone Area (Between Optimistic & Pessimistic)
        for (let i = 0; i < traj.length; i++) {
          const x = getX(i);
          const y = getY(traj[i].optimistic);
          if (i === 0) areaPath += `M ${x} ${y}`;
          else areaPath += ` L ${x} ${y}`;
        }
        for (let i = traj.length - 1; i >= 0; i--) {
          const x = getX(i);
          const y = getY(traj[i].pessimistic);
          areaPath += ` L ${x} ${y}`;
        }
        areaPath += ' Z';

        // Retirement marker line
        const retIndex = traj.findIndex(t => t.age === profile.retirementAge);
        const retX = retIndex !== -1 ? getX(retIndex) : null;

        return {
          width,
          height,
          padding,
          maxBalance,
          getX,
          getY,
          optPath,
          medPath,
          pessPath,
          areaPath,
          retX,
          traj
        };
      }, [simulationResults.trajectory, profile.retirementAge]);

                    <Icon name="shieldCheck" size={16} className="text-indigo-600 dark:text-indigo-400 shrink-0 mt-0.5" />
                    <div>
                      <span className="font-semibold">Local-First Storage:</span> Saved under key prefix <code className="font-mono text-indigo-600 dark:text-indigo-300">finvest_retirement_*</code>.
                    </div>
                  </div>

                  {/* Export Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Export Settings to JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Download your asset allocation, cash flows, and simulation parameters.
                      </div>
                    </div>
                    <button
                      onClick={handleExportBackup}
                      className="px-3.5 py-2 text-xs font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-1.5 transition"
                    >
                      <Icon name="download" size={14} />
                      <span>Export JSON</span>
                    </button>
                  </div>

                  {/* Import Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Import from JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Restore retirement settings from a previously saved file.
                      </div>
                    </div>
                    <label className="cursor-pointer px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 shadow-sm flex items-center gap-1.5 transition">
                      <Icon name="upload" size={14} />
                      <span>Import File</span>
                      <input
                        type="file"
                        accept=".json,application/json"
                        onChange={handleImportBackup}
                        className="sr-only"
                      />
                    </label>
                  </div>

                  {/* Danger / Reset Zone */}
                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <span className="text-xs text-slate-500">Need to restore standard assumptions?</span>
                    <button
                      onClick={handleResetDefaults}
                      className="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline flex items-center gap-1"
                    >
                      <Icon name="refresh" size={13} />
                      <span>Reset to Defaults</span>
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount with React 18 createRoot
    const rootEl = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      ReactDOM.render(<App />, rootEl);
    }
  </script>
</body>
</html>
