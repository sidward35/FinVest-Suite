<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinVest Suite | Unified Local-First Personal Finance Portal</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
              950: '#1e1b4b',
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.4);
      border-radius: 9999px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.5);
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card-animate {
      animation: cardFadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>

  <!-- React 18, ReactDOM, and Babel Standalone (cdnjs Cloudflare CDN - No crossorigin to prevent file:// protocol CORS issues) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.10/babel.min.js"></script>

  <!-- Secondary CDN Fallbacks -->
  <script>
    if (!window.React) document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js"><\/script>');
  </script>
  <script>
    if (!window.ReactDOM) document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"><\/script>');
  </script>
  <script>
    if (!window.Babel) document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
  </script>

  <!-- Error Catcher to prevent blank screen without visible feedback -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('App runtime error:', e);
      var root = document.getElementById('root');
      if (root && (!root.children.length || root.querySelector('#app-loader'))) {
        root.innerHTML = '<div style="padding: 24px; font-family: sans-serif; color: #e11d48; background: #fff1f2; border: 1px solid #fda4af; border-radius: 12px; margin: 32px max(16px, calc((100% - 600px)/2));">' +
          '<h2 style="margin: 0 0 8px; font-size: 18px; font-weight: 700;">⚠️ Portal Initialization Error</h2>' +
          '<p style="margin: 0; font-size: 14px; color: #4b5563;">' + (e.message || 'Script error occurred') + '</p>' +
          '<p style="margin: 8px 0 0; font-size: 12px; color: #9ca3af;">Source: ' + (e.filename || '') + ' line ' + (e.lineno || '') + '</p>' +
        '</div>';
      }
    });
  </script>
</head>
<body class="h-full bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
  <div id="root" class="min-h-full flex flex-col">
    <div id="app-loader" class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 text-slate-500 text-sm">
      <div class="flex items-center gap-3">
        <div class="w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <span>Loading FinVest Portal...</span>
      </div>
    </div>
  </div>

  <!-- React Application Script -->
  <script type="text/babel" data-presets="react,env">
    const { useState, useEffect } = React;

    // --- ICON SYSTEM (Lucide-style Clean SVGs - All multi-elements wrapped in React Fragments) ---
    const Icon = ({ name, size = 18, className = "" }) => {
      const icons = {
        landmark: <><line x1="3" y1="22" x2="21" y2="22" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><line x1="6" y1="18" x2="6" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><line x1="10" y1="18" x2="10" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><line x1="14" y1="18" x2="14" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><line x1="18" y1="18" x2="18" y2="11" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><polygon points="12 2 20 7 4 7" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></>,
        pieChart: <><path d="M21.21 15.89A10 10 0 1 1 8 2.83" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><path d="M22 12A10 10 0 0 0 12 2v10z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></>,
        sunUmbrella: <><path d="M12 2v20" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /><path d="M4 12a8 8 0 0 1 16 0z" fill="none" stroke="currentColor" strokeWidth="2" /><path d="M4 12c2.5-1 5.5-1 8 0 2.5-1 5.5-1 8 0" fill="none" stroke="currentColor" strokeWidth="2" /></>,
        trendingUp: <path d="M22 7 13.5 15.5 8.5 10.5 2 17M16 7h6v6" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        arrowRight: <path d="M5 12h14M12 5l7 7-7 7" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        sun: <><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" strokeWidth="2" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /></>,
        moon: <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        shieldCheck: <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.8 17 5 19 5a1 1 0 0 1 1 1zM9 12l2 2 4-4" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        grid: <><rect width="7" height="7" x="3" y="3" rx="1" fill="none" stroke="currentColor" strokeWidth="2" /><rect width="7" height="7" x="14" y="3" rx="1" fill="none" stroke="currentColor" strokeWidth="2" /><rect width="7" height="7" x="14" y="14" rx="1" fill="none" stroke="currentColor" strokeWidth="2" /><rect width="7" height="7" x="3" y="14" rx="1" fill="none" stroke="currentColor" strokeWidth="2" /></>,
        sparkles: <path d="m12 3 1.9 5.8a2 2 0 0 0 1.3 1.3l5.8 1.9-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />,
        info: <><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" strokeWidth="2" /><path d="M12 16v-4M12 8h.01" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" /></>
      };

      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          className={`inline-block shrink-0 ${className}`}
        >
          {icons[name] || icons.landmark}
        </svg>
      );
    };

    // --- 4 SUITE APPS SPECIFICATION ---
    const APPS = [
      {
        id: 'budget',
        name: 'Budget & Cashflow',
        subtitle: 'App 1 • Income & Expenses',
        badge: '📊 Cashflow',
        badgeColor: 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950/70 dark:text-indigo-400 border-indigo-200/60 dark:border-indigo-800/60',
        icon: 'pieChart',
        iconBg: 'from-indigo-600 to-indigo-500',
        subdomainUrl: 'https://finvest.smathur.xyz/money-manager',
        localUrl: './finvest-budget/index.html',
        description: 'Take command of your monthly cashflow with granular category tracking, interactive spending donuts, and annual trends.',
        features: [
          'Income & expense ledger with 30+ custom emojis',
          'Interactive spending breakdown donut & ranked categories',
          'Monthly & full-year 2026 cashflow trend comparisons'
        ]
      },
      {
        id: 'retirement',
        name: 'Retirement Planner',
        subtitle: 'App 2 • Monte Carlo & FIRE',
        badge: '🏖️ Simulation',
        badgeColor: 'bg-amber-50 text-amber-700 dark:bg-amber-950/70 dark:text-amber-400 border-amber-200/60 dark:border-amber-800/60',
        icon: 'sunUmbrella',
        iconBg: 'from-amber-500 to-indigo-600',
        subdomainUrl: 'https://finvest.smathur.xyz/retirement-calculator',
        localUrl: './finvest-retirement/index.html',
        description: 'Probabilistic 500-iteration Monte Carlo stress-testing to model sequence-of-returns volatility and fund longevity.',
        features: [
          'Stocks, bonds & cash asset allocation split sliders',
          'Probabilistic curves: 90th optimistic, 50th median, 10th pessimistic',
          'Trinity Study Safe Withdrawal Rate (SWR) longevity matrix'
        ]
      },
      {
        id: 'investments',
        name: 'Investment Portfolio',
        subtitle: 'App 3 • Heatmap & Finnhub Quotes',
        badge: '📈 Treemap',
        badgeColor: 'bg-emerald-50 text-emerald-700 dark:bg-emerald-950/70 dark:text-emerald-400 border-emerald-200/60 dark:border-emerald-800/60',
        icon: 'trendingUp',
        iconBg: 'from-emerald-600 to-indigo-600',
        subdomainUrl: 'https://finvest.smathur.xyz/investments-tracker',
        localUrl: './finvest-investments/index.html',
        description: 'Point-in-time portfolio tracker featuring an interactive market treemap scaled by value and live quotes via Finnhub API.',
        features: [
          'Stocks, ETFs, and Alternative Assets (Crypto, Gold, Real Estate)',
          'Proportional BSP Treemap heatmap color-coded by unrealized P&L',
          'Finnhub API integration for automated real-time market prices'
        ]
      },
      {
        id: 'networth',
        name: 'Net Worth Tracker',
        subtitle: 'App 4 • Balance Sheet & Snapshots',
        badge: '🏛️ Balance Sheet',
        badgeColor: 'bg-sky-50 text-sky-700 dark:bg-sky-950/70 dark:text-sky-400 border-sky-200/60 dark:border-sky-800/60',
        icon: 'landmark',
        iconBg: 'from-indigo-700 via-indigo-600 to-sky-500',
        subdomainUrl: 'https://finvest.smathur.xyz/networth-tracker',
        localUrl: './finvest-networth/index.html',
        description: 'Track long-term wealth accumulation through historical snapshots, balance sheet leverage, and asset class shifts.',
        features: [
          'Historical net worth trajectory and milestone points',
          'Bi-directional asset vs. liability expansion bar chart',
          '100% stacked composition shift and retirement nest egg tracker'
        ]
      }
    ];

    // --- MAIN REACT APPLICATION ---
    function App() {
      // Theme State (shared across finvest_theme)
      const [theme, setTheme] = useState(() => {
        const saved = localStorage.getItem('finvest_theme');
        if (saved) return saved;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });

      useEffect(() => {
        const root = document.documentElement;
        if (theme === 'dark') {
          root.classList.add('dark');
        } else {
          root.classList.remove('dark');
        }
        localStorage.setItem('finvest_theme', theme);
      }, [theme]);

      const toggleTheme = () => {
        setTheme(prev => prev === 'dark' ? 'light' : 'dark');
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans">
          
          {/* HEADER */}
          <header className="sticky top-0 z-40 w-full backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* Brand Logo */}
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-sky-500 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
                    <Icon name="landmark" size={20} className="text-white" />
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="font-extrabold text-base tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-800 dark:from-white dark:via-indigo-200 dark:to-slate-200">
                        FinVest
                      </span>
                      <span className="px-1.5 py-0.5 text-[10px] font-bold tracking-wider uppercase rounded bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-400 border border-indigo-200/60 dark:border-indigo-800/60">
                        Suite Portal
                      </span>
                    </div>
                    <span className="block text-[11px] text-slate-500 dark:text-slate-400 -mt-0.5">
                      Local-First Personal Finance
                    </span>
                  </div>
                </div>

                {/* Right Controls: Offline Badge & Theme Toggle */}
                <div className="flex items-center gap-3">
                  {/* Private Badge */}
                  <div className="hidden sm:flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-700 dark:bg-emerald-950/50 dark:text-emerald-400 border border-emerald-200/60 dark:border-emerald-800/40">
                    <Icon name="shieldCheck" size={13} />
                    <span>100% Private & Offline</span>
                  </div>

                  {/* Theme Mode Toggle */}
                  <button
                    onClick={toggleTheme}
                    className="p-2 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                    aria-label="Toggle Dark/Light Mode"
                  >
                    {theme === 'dark' ? (
                      <Icon name="sun" size={18} className="text-amber-400" />
                    ) : (
                      <Icon name="moon" size={18} className="text-slate-700" />
                    )}
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* MAIN HERO & 2x2 APP GRID */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 sm:py-16 flex flex-col justify-center space-y-12">
            
            {/* HERO SECTION */}
            <div className="text-center max-w-3xl mx-auto space-y-3">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200/60 dark:border-indigo-800/60 mb-2">
                <Icon name="sparkles" size={14} />
                <span>Unified Personal Finance Suite</span>
              </div>
              <h1 className="text-3xl sm:text-5xl font-extrabold tracking-tight text-slate-900 dark:text-white">
                Everything you need to master your wealth.
              </h1>
              <p className="text-sm sm:text-base text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">
                Four specialized, local-first applications built with zero backend dependencies. Your financial data stays 100% confidential in your browser.
              </p>
            </div>

            {/* 4 RECTANGULAR BOXES (2x2 GRID) */}
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6 sm:gap-8 max-w-5xl mx-auto w-full">
              {APPS.map((app, idx) => (
                <div
                  key={app.id}
                  className="bg-white dark:bg-slate-900 rounded-3xl p-6 sm:p-8 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between group card-animate"
                  style={{ animationDelay: `${idx * 80}ms` }}
                >
                  <div>
                    {/* Top Header Row: Icon & Badge */}
                    <div className="flex items-center justify-between mb-5">
                      <div className={`w-12 h-12 rounded-2xl bg-gradient-to-tr ${app.iconBg} flex items-center justify-center text-white shadow-md group-hover:scale-105 transition-transform`}>
                        <Icon name={app.icon} size={24} className="text-white" />
                      </div>
                      <span className={`px-2.5 py-1 text-xs font-bold rounded-lg border ${app.badgeColor}`}>
                        {app.badge}
                      </span>
                    </div>

                    {/* App Title & Subtitle */}
                    <h2 className="text-xl font-bold text-slate-900 dark:text-white tracking-tight group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
                      {app.name}
                    </h2>
                    <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mt-0.5 mb-3">
                      {app.subtitle}
                    </div>

                    {/* Description */}
                    <p className="text-xs sm:text-sm text-slate-600 dark:text-slate-400 leading-relaxed mb-6">
                      {app.description}
                    </p>

                    {/* Feature Bullet Points */}
                    <div className="space-y-2 mb-6">
                      {app.features.map((feat, fIdx) => (
                        <div key={fIdx} className="flex items-start gap-2 text-xs text-slate-700 dark:text-slate-300">
                          <span className="text-emerald-500 font-bold mt-0.5">✓</span>
                          <span>{feat}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Bottom CTA Button */}
                  <div className="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                    <span className="text-[11px] font-mono text-slate-400 truncate max-w-[200px]">
                      {app.subdomainUrl}
                    </span>
                    <a
                      href={app.subdomainUrl}
                      className="px-4 py-2.5 text-xs font-bold rounded-xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 hover:bg-indigo-600 dark:hover:bg-indigo-400 dark:hover:text-white shadow-sm flex items-center gap-2 group-hover:gap-3 transition-all"
                    >
                      <span>Launch App</span>
                      <Icon name="arrowRight" size={14} />
                    </a>
                  </div>
                </div>
              ))}
            </div>

            {/* SUITE GUARANTEE BANNER */}
            <div className="p-6 rounded-2xl bg-indigo-50/60 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900/40 max-w-4xl mx-auto w-full text-center space-y-2">
              <div className="font-extrabold text-sm text-indigo-950 dark:text-indigo-200">
                🔒 Private, Local-First Architecture
              </div>
              <p className="text-xs text-slate-600 dark:text-slate-400 max-w-2xl mx-auto leading-relaxed">
                All four apps run 100% client-side in your browser. Each app uses isolated storage keys (<code>finvest_budget_*</code>, <code>finvest_retirement_*</code>, <code>finvest_investments_*</code>, <code>finvest_networth_*</code>) and provides one-click JSON backup and restore.
              </p>
            </div>

            {/* LEGAL & FINANCIAL DISCLAIMER SECTION */}
            <section className="max-w-5xl mx-auto w-full px-4 text-xs text-slate-500 dark:text-slate-400 border-t border-slate-200 dark:border-slate-800 pt-8 space-y-3">
              <div className="flex items-center gap-2 font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider text-[11px]">
                <Icon name="info" size={15} className="text-amber-500" />
                <span>Important Financial & Legal Disclaimer</span>
              </div>
              <p className="leading-relaxed">
                <strong>Educational & Informational Purposes Only:</strong> The FinVest suite of applications, calculators, projections, and simulation models are provided exclusively for personal informational and educational purposes. None of the content, calculations, Monte Carlo simulations, historical estimates, safe withdrawal rates, or portfolio metrics constitute personalized financial, investment, legal, tax, or accounting advice.
              </p>
              <p className="leading-relaxed">
                <strong>Consult Licensed Professionals:</strong> The creators, developers, and hosts of this software are not registered investment advisors, broker-dealers, or certified financial planners. Before making any investment decisions, retirement withdrawals, tax strategies, or major financial commitments, you should seek independent advice from a licensed Certified Financial Planner (CFP®), Certified Public Accountant (CPA), Registered Investment Advisor (RIA), or qualified tax attorney who can evaluate your unique circumstances.
              </p>
              <p className="leading-relaxed">
                <strong>Market Risk & No Guarantees:</strong> Investing in securities, stocks, bonds, cryptocurrencies, and alternative assets carries inherent risk of loss, including the potential loss of principal. Past performance does not predict or guarantee future investment results. Mathematical projections and Monte Carlo simulations are hypothetical constructs based on historical or user-specified assumptions; actual market returns, inflation rates, and sequence of returns will vary and may significantly impact real-world outcomes.
              </p>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 pt-1">
                <strong>Local-First Data Responsibility:</strong> Your financial records remain strictly stored on your own local device in browser <code className="font-mono">localStorage</code>. No financial data is ever transmitted to remote servers. You are solely responsible for exporting and securing regular JSON backups of your financial records.
              </p>
            </section>

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-800 py-8 bg-white/50 dark:bg-slate-900/50 transition-colors">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500 dark:text-slate-400">
              <div className="flex items-center gap-2">
                <span className="font-semibold text-slate-700 dark:text-slate-300">FinVest Suite</span>
                <span>•</span>
                <span>Client-Side Personal Finance Ecosystem</span>
              </div>
              <div className="flex items-center gap-4">
                <span>React 18</span>
                <span>•</span>
                <span>Tailwind CSS</span>
                <span>•</span>
                <span>Zero Server Telemetry</span>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount with React 18 createRoot
    const rootEl = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      ReactDOM.render(<App />, rootEl);
    }
  </script>
</body>
</html>
