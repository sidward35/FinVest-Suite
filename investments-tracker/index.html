    // --- RECURSIVE SQUARIFIED/BSP TREEMAP GENERATOR ---
    function computeTreemapLayout(items, x, y, width, height) {
      if (!items || items.length === 0) return [];
      if (items.length === 1) {
        return [{ ...items[0], x, y, w: width, h: height }];
      }

      const totalVal = items.reduce((acc, cur) => acc + cur.currentValue, 0);
      if (totalVal <= 0) return [];

      // Find split index closest to 50%
      const half = totalVal / 2;
      let acc = 0;
      let splitIdx = 1;
      for (let i = 0; i < items.length; i++) {
        acc += items[i].currentValue;
        if (acc >= half) {
          splitIdx = (i === 0) ? 1 : i;
          break;
        }
      }
      splitIdx = Math.max(1, Math.min(items.length - 1, splitIdx));

      const leftSlice = items.slice(0, splitIdx);
      const rightSlice = items.slice(splitIdx);

      const leftVal = leftSlice.reduce((acc, cur) => acc + cur.currentValue, 0);
      const ratio = leftVal / totalVal;

      const results = [];
      if (width >= height) {
        // Split horizontally
        const wLeft = width * ratio;
        results.push(...computeTreemapLayout(leftSlice, x, y, wLeft, height));
        results.push(...computeTreemapLayout(rightSlice, x + wLeft, y, width - wLeft, height));
      } else {
        // Split vertically
        const hTop = height * ratio;
        results.push(...computeTreemapLayout(leftSlice, x, y, width, hTop));
        results.push(...computeTreemapLayout(rightSlice, x, y + hTop, width, height - hTop));
      }
      return results;
    }

          try {

            const res = await fetch(url);

              if (data && typeof data.c === 'number' && data.c > 0) {
                const idx = updatedList.findIndex(a => a.id === item.id);
                if (idx !== -1) {
                  updatedList[idx] = {
                    ...updatedList[idx],
                    currentPrice: data.c,
                    priceChange: data.d,
                    priceChangePct: data.dp
                  };
                  updatedCount++;
                }
              }
            }
          } catch (err) {
            console.warn(`Failed to fetch quote for ${item.ticker}:`, err);
          }

          // Polite throttle for Finnhub free rate limit
          await new Promise(r => setTimeout(r, 180));
        }

        setIsFetchingQuotes(false);
        setFetchProgress(null);
        setLastRefreshedAt(new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
        showToast(`Updated live market prices for ${updatedCount} assets!`);

          const newPrice = Math.max(0.01, a.currentPrice * (1 + deltaPct));
          return { ...a, currentPrice: parseFloat(newPrice.toFixed(2)) };

              return;

            }
            showToast('Portfolio successfully restored from backup!');
            setIsBackupModalOpen(false);
          } catch (err) {
            alert('Failed to parse JSON file: ' + err.message);
          }
        };
        reader.readAsText(file);

                  <button
                    onClick={() => setIsApiKeyModalOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-5 space-y-4">
                  <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed">
                    Connect your free Finnhub account to stream real-time price quotes for all US Stocks and ETFs directly into your browser. Your API key is stored <strong>locally only</strong> in your browser's <code className="text-indigo-500">localStorage</code>.
                  </p>

                  <div>
                    <label className="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1">
                      Finnhub API Token
                    </label>
                    <input
                      type="text"
                      placeholder="e.g. c123456789abcdef..."
                      value={finnhubKey}
                      onChange={(e) => setFinnhubKey(e.target.value)}
                      className="w-full px-3 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-mono text-slate-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    />
                  </div>

                  <div className="p-3 bg-emerald-50/60 dark:bg-emerald-950/30 border border-emerald-100 dark:border-emerald-900/40 rounded-xl text-xs text-emerald-900 dark:text-emerald-200 flex items-center justify-between">
                    <div>
                      <div className="font-bold">Need a free Finnhub API Key?</div>
                      <div className="text-[11px] text-emerald-700 dark:text-emerald-300">Takes 30 seconds to sign up for free tier.</div>
                    </div>
                    <a
                      href="https://finnhub.io/dashboard"
                      target="_blank"
                      rel="noopener noreferrer"
                      className="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-semibold text-xs flex items-center gap-1 shadow-xs"
                    >
                      <span>Get Free Key</span>
                      <Icon name="externalLink" size={12} />
                    </a>
                  </div>

                  <div className="pt-2 flex items-center justify-end gap-2">
                    <button
                      onClick={() => setIsApiKeyModalOpen(false)}
                      className="px-4 py-2 text-xs font-bold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-md transition"
                    >
                      Save Key
                    </button>
                  </div>
                </div>

              </div>
            </div>
          )}

          {/* ========================================================
              MODAL 3: DATA BACKUP (EXPORT / IMPORT JSON)
             ======================================================== */}
          {isBackupModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/50 backdrop-blur-sm">
              <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden modal-animate">
                
                <div className="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <div>
                    <h3 className="font-bold text-base text-slate-900 dark:text-white flex items-center gap-2">
                      <Icon name="database" size={18} className="text-indigo-500" />
                      Portfolio Backup & Portability
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                      Your holdings live exclusively in browser <code className="text-indigo-500">localStorage</code>.
                    </p>
                  </div>
                  <button
                    onClick={() => setIsBackupModalOpen(false)}
                    className="p-1 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                  >
                    <Icon name="x" size={18} />
                  </button>
                </div>

                <div className="p-6 space-y-6">
                  
                  <div className="p-3.5 rounded-xl bg-indigo-50/70 dark:bg-indigo-950/40 border border-indigo-100 dark:border-indigo-900/60 text-xs text-indigo-950 dark:text-indigo-200 flex items-start gap-2.5">
                    <Icon name="shieldCheck" size={16} className="text-indigo-600 dark:text-indigo-400 shrink-0 mt-0.5" />
                    <div>
                      <span className="font-semibold">Local-First Storage:</span> Saved under key prefix <code className="font-mono text-indigo-600 dark:text-indigo-300">finvest_investments_*</code>.
                    </div>
                  </div>

                  {/* Export Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Export Portfolio to JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Download all {assets.length} holdings, quantities, and cost bases.
                      </div>
                    </div>
                    <button
                      onClick={handleExportBackup}
                      className="px-3.5 py-2 text-xs font-semibold rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm flex items-center gap-1.5 transition"
                    >
                      <Icon name="download" size={14} />
                      <span>Export JSON</span>
                    </button>
                  </div>

                  {/* Import Section */}
                  <div className="flex items-center justify-between p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40">
                    <div>
                      <div className="font-bold text-xs text-slate-900 dark:text-white">Import from JSON</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">
                        Restore positions from a previously exported backup file.
                      </div>
                    </div>
                    <label className="cursor-pointer px-3.5 py-2 text-xs font-semibold rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 shadow-sm flex items-center gap-1.5 transition">
                      <Icon name="upload" size={14} />
                      <span>Import File</span>
                      <input
                        type="file"
                        accept=".json,application/json"
                        onChange={handleImportBackup}
                        className="sr-only"
                      />
                    </label>
                  </div>

                  {/* Reset Demo Data */}
                  <div className="pt-2 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between">
                    <span className="text-xs text-slate-500">Need to reload sample demo holdings?</span>
                    <button
                      onClick={handleResetDemoData}
                      className="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline flex items-center gap-1"
                    >
                      <Icon name="refresh" size={13} />
                      <span>Load Sample Holdings</span>
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount with React 18 createRoot
    const rootEl = document.getElementById('root');
    if (ReactDOM.createRoot) {
      ReactDOM.createRoot(rootEl).render(<App />);
    } else {
      ReactDOM.render(<App />, rootEl);
    }
  </script>
</body>
</html>
